<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Organizer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<style>
  :root{--bg:#f6f0e6;--card:#fffdf8;--ink:#2b2220;--muted:#7d6f68;--red:#7a1f2b;--green:#1f4d3a;--line:#e6dccd}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--green);color:#fff;padding:22px 18px}
  header h1{margin:0;font-family:Georgia,serif;font-size:24px}
  header a{color:#cfe3d8;font-size:14px}
  main{max-width:600px;margin:0 auto;padding:16px 14px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  h2{margin:0 0 12px;font-size:18px}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
  .sub{font-weight:400;color:var(--muted)}
  input,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:150px;line-height:1.45}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:var(--red);color:#fff;cursor:pointer}
  .btn.green{background:var(--green)}
  .btn.light{background:#efe6d8;color:var(--ink)}
  .btn.small{display:inline-block;width:auto;margin:0;padding:7px 12px;font-size:13px}
  .btn:disabled{opacity:.5}
  .msg{min-height:20px;margin-top:10px;font-size:14px;font-weight:600}
  .msg.bad{color:#a8323f}.msg.good{color:var(--green)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.8px}
  .ok{color:var(--green);font-weight:700}.no{color:var(--muted)}
  .stat{font-size:15px;margin-bottom:10px}
  details summary{cursor:pointer;font-weight:700;font-size:16px;padding:4px 0}
  .hide{display:none}
  .vw{font-size:13px;color:var(--green);font-weight:600}
  .log{margin-top:12px;max-height:60vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
  .le{padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}
  .le:last-child{border-bottom:0}
  .le .lt{font-size:12px;color:var(--muted);margin-bottom:2px}
  .le.warn{background:#fbeef0}
</style>
</head>
<body>
<header><h1>🎄 Organizer</h1><a href="/">← Back to the main page</a></header>
<main id="app"><div class="card">Loading…</div></main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let PW = '';
try { PW = sessionStorage.getItem('gxpw') || ''; } catch {}
let DATA = null;

async function api(action, extra = {}) {
  const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, password: PW, ...extra }) });
  const j = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, ...j };
}
function msg(id, text, good) { const m = $(id); if (m) { m.textContent = text || ''; m.className = 'msg ' + (good ? 'good' : 'bad'); } }

async function start() {
  const s = await api('status');
  if (s.error === 'db') { $('app').innerHTML = `<div class="card"><h2>Database not connected</h2><p>In Vercel, open this project → Storage → connect the Upstash Redis database, then redeploy.</p></div>`; return; }
  if (!s.hasPassword) return showSetup();
  if (PW) { const t = await api('load'); if (t.ok) return showMain(t); }
  showLogin();
}

function showSetup() {
  $('app').innerHTML = `<div class="card"><h2>Create your organizer password</h2>
    <p class="sub">Only you will use this. At least 6 characters.</p>
    <input id="p1" type="password" placeholder="Password"><input id="p2" type="password" placeholder="Type it again" style="margin-top:8px">
    <button class="btn green" id="go">Create password</button><div class="msg" id="m"></div></div>`;
  $('go').onclick = async () => {
    if ($('p1').value !== $('p2').value) return msg('m', 'Passwords don’t match.');
    PW = $('p1').value;
    const r = await api('setup');
    if (!r.ok) return msg('m', r.message);
    try { sessionStorage.setItem('gxpw', PW); } catch {}
    start();
  };
}

function showLogin() {
  $('app').innerHTML = `<div class="card"><h2>Organizer login</h2>
    <input id="p" type="password" placeholder="Password"><button class="btn green" id="go">Log in</button><div class="msg" id="m"></div></div>`;
  const go = async () => {
    PW = $('p').value; const r = await api('load');
    if (!r.ok) return msg('m', r.message || 'Wrong password.');
    try { sessionStorage.setItem('gxpw', PW); } catch {}
    showMain(r);
  };
  $('go').onclick = go; $('p').onkeydown = e => { if (e.key === 'Enter') go(); };
}

// Display-only: pull links typed into wish list text out into link cards. Never saved.
function splitWishLinks(text) {
  const URL_G = /https?:\/\/[^\s<>"]+/gi;
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const keep = [], links = [];
  const tidy = s => s.replace(/^[\s\-–—•*·>]+/, '').replace(/[\s\-–—:|·,(\[]+$/, '').trim();
  const unparen = s => { const t = s.trim(); const m = t.match(/^\((.*)\)$/); return (m ? m[1] : t).trim(); };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const found = line.match(URL_G) || [];
    if (found.length !== 1) { keep.push(line); continue; }   // no link, or several on one line: leave as text
    const raw = found[0];
    const url = raw.replace(/[).,!?]+$/, '');
    try { const u = new URL(url); if (!/^https?:$/.test(u.protocol)) throw 0; } catch { keep.push(line); continue; }
    const at = line.indexOf(raw);
    const before = tidy(line.slice(0, at));
    let after = line.slice(at + url.length).trim();
    if (after.startsWith(')') && !after.includes('(')) after = after.slice(1).trim();
    const extras = [];
    if (tidy(after)) extras.push(unparen(tidy(after)));
    const next = lines[i + 1];
    if (next !== undefined && /^\s*\([^()]*\)\s*$/.test(next) && !URL_G.test(next)) { extras.push(unparen(next)); i++; }
    URL_G.lastIndex = 0;
    links.push({ url, note: [before, ...extras].filter(Boolean).join(' · ') });
  }
  return { text: keep.join('\n').replace(/\n{3,}/g, '\n\n').trim(), links };
}

function parseNames(t) { return t.split(/\n|,/).map(s => s.trim()).filter(Boolean); }
function parseGroups(t) {
  return t.split('\n').map(l => l.split(/\s*(?:\+|,|&|\/|\band\b)\s*/i).map(s => s.trim()).filter(Boolean)).filter(g => g.length > 1);
}

function detailsForm(c) {
  return `
    <label>Title</label><input id="title" value="${esc(c.title || 'Cousins Secret Santa')}">
    <div class="row">
      <div><label>Price limit <span class="sub">(optional)</span></label><input id="price" value="${esc(c.price || '')}" placeholder="$25"></div>
      <div><label>Party <span class="sub">(optional)</span></label><input id="date" value="${esc(c.date ?? 'Christmas Eve')}"></div>
    </div>
    <label>Your name <span class="sub">(shown as who to text for help)</span></label><input id="org" value="${esc(c.organizer ?? 'Josh')}">`;
}
function details() { return { title: $('title').value, price: $('price').value, date: $('date').value, organizer: $('org').value }; }

function drawForm(c) {
  return `
    <label>Everyone’s names <span class="sub">(one per line)</span></label>
    <textarea id="names" placeholder="Josh&#10;Hannah&#10;Ben&#10;Sidney&#10;Nick">${esc((c.names || []).join('\n'))}</textarea>
    <label>Couples / households <span class="sub">(one per line, they won’t draw each other)</span></label>
    <textarea id="groups" style="min-height:100px" placeholder="Hannah + Ben&#10;Sidney + Nick&#10;Lindsey + Shane">${esc((c.groups || []).map(g => g.join(' + ')).join('\n'))}</textarea>`;
}

function showMain(d) {
  DATA = d;
  const c = d.config || {};
  if (!d.config) {
    $('app').innerHTML = `<div class="card"><h2>Set up the Secret Santa</h2>${detailsForm(c)}${drawForm(c)}
      <button class="btn" id="draw">Open it up 🎁</button><div class="msg" id="m"></div></div>`;
    $('draw').onclick = () => doDraw(false);
    return;
  }
  const done = d.drawn.filter(Boolean).length, total = c.names.length, wl = d.wish.filter(Boolean).length;
  const rows = c.names.map((n, i) => `<tr><td><b>${esc(n)}</b>${d.wish[i] ? `<br><a href="#" class="vw" data-vw="${esc(n)}">View list</a>` : ''}</td>
      <td>${d.wish[i] ? '<span class="ok">✓</span>' : '<span class="no">–</span>'}</td>
      <td>${d.drawn[i] ? '<span class="ok">✓</span>' : '<span class="no">–</span>'}</td>
      <td style="text-align:right;white-space:nowrap">${d.setup[i] ? `<button class="btn light small" data-pin="${esc(n)}">New PIN</button> <button class="btn light small" data-reset="${esc(n)}">Reset</button>` : ''}</td></tr>`).join('');
  $('app').innerHTML = `
    <div id="wishView"></div>
    <div class="card"><h2>Progress</h2>
      <div class="stat"><b>${done}</b> of ${total} have spun · <b>${wl}</b> of ${total} wish lists in</div>
      <table><tr><th>Name</th><th>List</th><th>Spun</th><th></th></tr>${rows}</table>
      <p class="sub" style="font-size:13px"><b>New PIN</b> = they forgot their PIN or got locked out. Keeps their wish list and their person; they just make a new PIN.<br>
      <b>Reset</b> = someone else used their name by mistake. Clears the PIN, wish list and spin so the real person can start fresh.</p>
      <button class="btn light" id="refresh">Refresh</button><div class="msg" id="rm"></div>
    </div>
    <div class="card"><details><summary>Edit title, price, party</summary>${detailsForm(c)}
      <button class="btn green" id="saveDetails">Save</button><div class="msg" id="dm"></div></details></div>
    <div class="card"><details><summary>Change names / start over</summary>
      <p class="sub">This wipes everything: every PIN, wish list and spin. Use it after testing, or if the names change after people already started.</p>
      ${drawForm(c)}<button class="btn" id="redraw">Start over with these names</button><div class="msg" id="m"></div></details></div>
    <div class="card"><details id="logbox"><summary>Activity log</summary>
      <p class="sub">Everything people do on the site, newest first. Doesn’t show who got who.</p>
      <button class="btn light" id="loadLog">Load / refresh log</button><div id="logList"></div></details></div>
    <div class="card"><details id="bk"><summary>Backup: who got who</summary>
      <p class="sub">Only for fixing problems.</p>
      <button class="btn light" id="reveal">Show matches</button><div id="pairs"></div></details></div>`;

  $('refresh').onclick = async () => { const r = await api('load'); if (r.ok) showMain(r); };
  const wireAct = (attr, action, label, done) => document.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = async () => {
    const n = b.dataset[attr];
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Confirm?'; return; }
    const r = await api(action, { name: n });
    if (!r.ok) return msg('rm', r.message);
    const t = await api('load'); if (t.ok) showMain(t);
    msg('rm', done(n), true);
  });
  document.querySelectorAll('[data-vw]').forEach(a => a.onclick = async (e) => {
    e.preventDefault();
    const n = a.dataset.vw, r = await api('viewwish', { name: n });
    if (!r.ok) return msg('rm', r.message || 'Couldn’t load it.');
    const host = u => { try { const h = new URL(u).hostname.replace(/^www\./, ''); return /^(a\.co|amzn\.to|amzn\.com|amazon\.[a-z.]+)$/i.test(h) ? 'Amazon' : h; } catch { return 'link'; } };
    const sp = splitWishLinks(r.wish); const all = [...sp.links, ...r.links];
    $('wishView').innerHTML = `<div class="card"><h2>${esc(n)}’s wish list</h2>
      ${sp.text ? `<div style="white-space:pre-wrap;font-size:16px;line-height:1.45">${esc(sp.text)}</div>` : '<p class="sub">No text.</p>'}
      ${all.length ? `<div style="margin-top:12px">${all.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer nofollow" style="display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;color:var(--ink);text-decoration:none"><b>${esc(l.note || 'Link')}</b><br><span style="color:var(--green);font-size:13px">🔗 ${esc(host(l.url))} ↗</span></a>`).join('')}</div>` : '<p class="sub">No links.</p>'}
      <button class="btn light" id="closeWV">Close</button></div>`;
    $('closeWV').onclick = () => { $('wishView').innerHTML = ''; };
    $('wishView').scrollIntoView({ behavior: 'smooth' });
  });
  wireAct('pin', 'newpin', 'New PIN', n => `${n} can tap their name and make a new PIN. Their list and person are kept.`);
  wireAct('reset', 'reset', 'Reset', n => `${n} was fully reset and can start fresh.`);
  const showLog = async () => {
    $('logList').innerHTML = '<p class="sub">Loading…</p>';
    const r = await api('log');
    if (!r.ok) { $('logList').innerHTML = `<p class="sub">${esc(r.message || 'Couldn’t load the log.')}</p>`; return; }
    if (!r.log.length) { $('logList').innerHTML = '<p class="sub">Nothing yet.</p>'; return; }
    const fmt = t => new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' });
    $('logList').innerHTML = `<div class="log">${r.log.map(e => `<div class="le ${/ERROR|FAILED|LOCKED|Wrong/.test(e.what) ? 'warn' : ''}">
        <div class="lt">${esc(fmt(e.t))}${e.dev ? ' · ' + esc(e.dev) : ''}</div>
        <div><b>${esc(e.who || 'Someone')}</b>: ${esc(e.what)}</div></div>`).join('')}</div>`;
  };
  $('loadLog').onclick = showLog;
  $('logbox').addEventListener('toggle', () => { if ($('logbox').open && !$('logList').innerHTML) showLog(); });
  $('saveDetails').onclick = async () => {
    const r = await api('details', details());
    msg('dm', r.ok ? 'Saved.' : r.message, r.ok);
  };
  $('redraw').onclick = () => {
    const b = $('redraw');
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Tap again to wipe everything and start over'; return; }
    doDraw(true);
  };
  $('reveal').onclick = async () => {
    const b = $('reveal');
    if ($('pairs').innerHTML) { $('pairs').innerHTML = ''; b.textContent = 'Show matches'; return; }
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Tap again to show'; return; }
    b.dataset.armed = '';
    const r = await api('reveal');
    if (!r.ok) return;
    $('pairs').innerHTML = `<table style="margin-top:10px"><tr><th>Giver</th><th></th><th>Buys for</th></tr>${r.pairs.map(([a, z]) => `<tr><td>${esc(a)}</td><td>→</td><td>${z ? `<b>${esc(z)}</b>` : '<span class="no">hasn’t spun</span>'}</td></tr>`).join('')}</table>`;
    b.textContent = 'Hide matches';
  };
}

async function doDraw(isRedraw) {
  const d = details();
  const payload = { ...d, names: parseNames($('names').value), groups: parseGroups($('groups').value), confirm: isRedraw };
  if (payload.names.length < 3) return msg('m', 'Add at least 3 names.');
  msg('m', 'Saving…', true);
  const r = await api('open', payload);
  if (!r.ok) return msg('m', r.message || 'Something went wrong.');
  const t = await api('load');
  showMain(t);
  window.scrollTo(0, 0);
}

start();
</script>
</body>
</html>
